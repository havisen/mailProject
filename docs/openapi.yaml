openapi: 3.1.0
info:
  title: Private Mail Panel Send API
  version: 1.0.0
  description: Send-only durable email submission. No status, inbox, contacts, tasks, or OTP operations exist.
paths:
  /api/v1/mail/send:
    post:
      operationId: sendMail
      summary: Durably queue supplied email
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Submission and outbound job committed; may be an identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429':
          description: Key request limit or account recipient quota exceeded.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Recipient:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, maxLength: 120 }
    SendRequest:
      type: object
      additionalProperties: false
      required: [account_id, to, subject, text]
      properties:
        account_id: { type: string, pattern: '^acct_[a-f0-9]{32}$' }
        to:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/Recipient' }
        cc:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Recipient' }
        bcc:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Recipient' }
        reply_to: { $ref: '#/components/schemas/Recipient' }
        subject: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, minLength: 1 }
        html: { type: string }
        send_before: { type: string, format: date-time }
      description: Combined to, cc, and bcc count must not exceed 10. JSON body limit is 256 KiB.
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, status, send_before]
          properties:
            id: { type: string, pattern: '^sub_[a-f0-9]{32}$' }
            status: { const: queued }
            send_before: { type: string, format: date-time }
        request_id: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
  responses:
    BadRequest: { description: Malformed JSON, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Missing, invalid, or revoked Bearer key, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Key lacks scope for the selected account, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Idempotency key was used with different content, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooLarge: { description: JSON body exceeds 256 KiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    UnsupportedMedia: { description: Content-Type is not application/json, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unprocessable: { description: Field validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unavailable: { description: Durable acceptance is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
